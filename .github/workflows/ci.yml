name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        # --frozen-lockfile (default in CI when pnpm-lock.yaml exists) fails the
        # build if the lockfile drifts from package.json. Requires pnpm-lock.yaml
        # to be committed to the repo.
        run: pnpm install --frozen-lockfile

      - name: Build shared-types first
        run: pnpm --filter @short-scanner/shared-types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
