# ═══════════════════════════════════════════════════════════════
# Docker Compose producción — short-scanner stack completo
#
# Usado por Dokploy (Application type: "Docker Compose").
# Las variables sensitivas (passwords, secrets) se definen en
# Dokploy UI → Environment, NO en este archivo.
#
# Estructura:
#   ┌─ postgres (BD persistente con volumen named)
#   ├─ redis    (BullMQ + cache)
#   ├─ api      (NestJS) ─── depende de postgres healthy
#   └─ web      (nginx) ──── depende de api
# ═══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in Dokploy env}
      POSTGRES_DB: ${POSTGRES_DB:-shortscanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shortscanner}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set (ej. https://app.tudominio.com)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shortscanner}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (generar con openssl rand -base64 64)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      TELEGRAM_ENCRYPTION_KEY: ${TELEGRAM_ENCRYPTION_KEY:?TELEGRAM_ENCRYPTION_KEY must be set (openssl rand -hex 32)}
      BINANCE_FUTURES_BASE_URL: https://fapi.binance.com
      TELEGRAM_API_BASE_URL: https://api.telegram.org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No exponemos puerto al host — Traefik de Dokploy enruta vía red interna

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    # No exponemos puerto al host — Traefik de Dokploy enruta vía red interna

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
