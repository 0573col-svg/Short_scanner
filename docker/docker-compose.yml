name: short-scanner

services:
  postgres:
    image: postgres:15-alpine
    container_name: shortscanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shortscanner
    ports:
      # Host 5436 → contenedor 5432. 5432-5435 ya los usan otros proyectos.
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shortscanner']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shortscanner-redis
    restart: unless-stopped
    ports:
      # Host 6380 → contenedor 6379. 6379 ya lo usa otro proyecto.
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
